[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeda-core"          # <- swap for whatever name you land on
dynamic = ["version"]
description = "Agentic, LLM-driven automated exploratory data analysis engine."
readme = "README.md"
license = { text = "MIT" }     # <- match whatever LICENSE file you add
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
keywords = ["eda", "exploratory-data-analysis", "pandas", "agent", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.6.0",
    "plotly>=5.24.0",   # pin the floor here now that you know the bdata cutoff matters
    "pillow>=9.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "Jinja2>=3.0.0",
    "requests>=2.28.0",
    "markdown>=3.4.0",
]

[project.optional-dependencies]
webapp = [
    "Django>=4.2.0",
    "whitenoise>=6.0.0",
    "gunicorn>=21.0.0",
]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/AniceKV/AutoEDA"
Repository = "https://github.com/AniceKV/AutoEDA"

[tool.setuptools.packages.find]
include = ["autoeda_core*"]

[tool.setuptools.dynamic]
version = { attr = "autoeda_core.__version__" }
