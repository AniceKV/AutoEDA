[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edanet"
dynamic = ["version"]
description = "AutoEDA Core Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Anish Kumar Verma"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.6.0",
    "plotly>=5.0.0",
    "pillow>=9.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "Jinja2>=3.0.0",
    "requests>=2.28.0",
    "markdown>=3.4.0"
]

[project.urls]
Homepage = "https://github.com/AniceKV/AutoEDA"
Repository = "https://github.com/AniceKV/AutoEDA.git"

[tool.setuptools.packages.find]
include = ["autoeda_core*"]

[tool.setuptools.dynamic]
version = {attr = "autoeda_core.__version__"}
